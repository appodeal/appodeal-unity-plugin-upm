name: Release

# Drafts the GitHub release once a release PR is merged into main. Publishing
# the draft creates the vX.Y.Z tag, and the tag is what games install, so the
# publish click stays with a person.
on:
  pull_request:
    types: [closed]
    branches: [main]
  # A manual rerun from the Actions tab. It always drafts from main, whatever
  # branch is picked in the run dialog.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'main' }}

      - name: Check version
        id: version
        run: |
          version=$(jq -r .version package.json)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Take release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Install UPM CLI
        run: |
          curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh | sh
          echo "$HOME/.upm/bin" >> "$GITHUB_PATH"

      - name: Pack and sign
        env:
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
          UNITY_ORG_ID: ${{ vars.UNITY_ORG_ID }}
        run: upm pack . --organization-id "$UNITY_ORG_ID" --destination build

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=(--draft --title "v$VERSION" --notes-file notes.md --target "$(git rev-parse HEAD)")
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" build/*.tgz "${flags[@]}"
